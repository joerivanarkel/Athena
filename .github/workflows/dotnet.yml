# Athena SSG — build, and deploy to GitHub Pages from master
name: Build and deploy site

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SSG_PROJECT: src/Athena.Ssg/Athena.Ssg.csproj
  CONTENT_DIR: src/Athena.Content/Content
  ASSETS_DIR: src/Athena.Ssg/wwwroot
  OUTPUT_DIR: ssg-output

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build solution
        run: dotnet build Athena.sln -c Release

      - name: Generate site
        run: |
          dotnet run --project "$SSG_PROJECT" -c Release --no-build -- \
            --content-dir "$GITHUB_WORKSPACE/$CONTENT_DIR" \
            --output-dir "$GITHUB_WORKSPACE/$OUTPUT_DIR" \
            --assets-dir "$GITHUB_WORKSPACE/$ASSETS_DIR" \
            --base-href "/${GITHUB_REPOSITORY#*/}/"

      - name: Add .nojekyll
        run: touch "$OUTPUT_DIR/.nojekyll"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTPUT_DIR }}

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
