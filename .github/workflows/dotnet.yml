# Athena SSG — build and deploy to GitHub Pages
name: .NET and GitHub Pages

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

env:
  REPOSITORY_NAME: Athena
  SSG_PROJECT: ./src/Athena.Ssg/Athena.Ssg.csproj
  CONTENT_DIR: src/Athena.Content/Content
  OUTPUT_DIR: ssg-output

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0.x

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

  deploy-to-github-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      - name: Build styles (SCSS + Tailwind)
        run: npm run build:styles

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Run SSG
        run: |
          dotnet run --project ${{ env.SSG_PROJECT }} --configuration Release -- \
            --content-dir ${{ github.workspace }}/${{ env.CONTENT_DIR }} \
            --output-dir ${{ github.workspace }}/${{ env.OUTPUT_DIR }} \
            --base-href /${{ env.REPOSITORY_NAME }}/

      - name: Copy CSS assets into output
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}/css ${{ env.OUTPUT_DIR }}/css/bootstrap
          cp src/Athena.Ssg/wwwroot/css/app.css \
             ${{ env.OUTPUT_DIR }}/css/app.css
          cp src/Athena.Ssg/wwwroot/css/bootstrap/bootstrap.min.css \
             ${{ env.OUTPUT_DIR }}/css/bootstrap/bootstrap.min.css
          cp src/Athena.Presentation.Components/wwwroot/css/Athena.Presentation.Components.css \
             ${{ env.OUTPUT_DIR }}/css/Athena.Presentation.Components.css

      - name: Add .nojekyll
        run: touch ${{ env.OUTPUT_DIR }}/.nojekyll

      - name: Commit output to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@3.7.1
        with:
          GITHUB_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
          BRANCH: gh-pages
          FOLDER: ${{ env.OUTPUT_DIR }}
